name: Node CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional tape glob/file to run instead of the full suite (e.g. test/parse.js)'
        type: string
        required: false
        default: ''

jobs:
  latest:
    name: 'latest majors'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [24, 22, 20, 18, 16, 14, 12, 10]
        exclude:
          # macos-latest is arm64: there are no darwin-arm64 builds below node 16.
          - os: macos-latest
            node-version: 14
          - os: macos-latest
            node-version: 12
          - os: macos-latest
            node-version: 10

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4

    # Dependencies are installed with a modern host node/npm (old npm against
    # the registry is fragile); the tests only need node_modules.
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: 'pin the npm registry to the release date'
      run: npm config set registry 'https://:2025-06-02T05%3A03%3A05.889Z@time-machines-npm.sealsecurity.io/'
      shell: bash

    - run: npm install
      shell: bash

    # Switch the runtime to the leg's node version for the test run.
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - run: node --version
      shell: bash

    - name: 'tape test/**/*.js'
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          ./node_modules/.bin/tape "${{ inputs.test-filter }}"
        else
          ./node_modules/.bin/tape 'test/**/*.js'
        fi

  node:
    name: 'node majors, windows/mac'
    needs: [latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo tests completed'
